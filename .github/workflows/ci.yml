name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The test suite has zero dependencies, so no install step is needed.
      - name: Syntax check browser scripts
        run: |
          node --check theory-absolute.js
          node --check main.js
      - name: Run tests
        run: node --test
